# Local/demo stack: `docker compose up --build`
#
#   storefront + admin  http://localhost:3000
#   Laravel API         http://localhost:8000/api/v1
#   Mailpit             http://localhost:8025
#   MySQL from the host localhost:3307
#
# Everything below is a development default. APP_KEY and the database
# passwords are local-only values; replace them before exposing this stack
# anywhere else. Stripe keys are read from your shell or a .env file next to
# this file, e.g. `STRIPE_KEY=pk_test_... docker compose up --build`.
#
# Ports can be moved without editing this file: APP_PORT, WEB_PORT,
# MYSQL_PORT, MAILPIT_UI_PORT and SEED_DATABASE are read from the environment.
# Changing WEB_PORT/APP_PORT requires a rebuild (they are baked into the
# frontend image's public URLs and the API's generated links).

name: nocfinity

x-backend-env: &backend-env
  APP_NAME: Nocfinity
  APP_ENV: local
  APP_KEY: "base64:0QOaGyhoO6DnTaKB7wT0J/JkD1kTsbdHeb2ODX1Z1OQ="
  APP_DEBUG: "true"
  APP_TIMEZONE: UTC
  APP_URL: http://localhost:${APP_PORT:-8000}
  FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
  CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
  FRONTEND_PASSWORD_RESET_URL: http://localhost:${WEB_PORT:-3000}/reset-password
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-nocfinity}
  DB_USERNAME: ${DB_USERNAME:-nocfinity}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: public
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: noreply@nocfinity.test
  MAIL_FROM_NAME: Nocfinity
  # Demo stack: keep password changes deterministic and offline-friendly.
  PASSWORD_CHECK_PWNED: "false"
  SANCTUM_TOKEN_EXPIRATION: "10080"
  STRIPE_KEY: "${STRIPE_KEY:-}"
  STRIPE_SECRET: "${STRIPE_SECRET:-}"
  STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nocfinity}
      MYSQL_USER: ${DB_USERNAME:-nocfinity}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  backend:
    image: nocfinity-backend:local
    build:
      context: ./backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "${SEED_DATABASE:-true}"
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  queue:
    image: nocfinity-backend:local
    build:
      context: ./backend
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: nocfinity-backend:local
    build:
      context: ./backend
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nocfinity-frontend:local
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
    environment:
      # Server-side calls go straight to the API container; the browser only
      # ever talks to http://localhost:${APP_PORT} for images and CSP.
      API_URL: http://backend:8000/api/v1
      API_PUBLIC_ORIGIN: http://localhost:${APP_PORT:-8000}
      NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
      # The optimizer cannot reach a host-published API from inside the
      # container, so admin/product images are served straight from Laravel.
      NEXT_IMAGE_UNOPTIMIZED: "true"
      COOKIE_SECURE: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
  backend_storage:
